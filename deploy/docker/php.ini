; Réglages PHP pour une instance KLASSCI en conteneur.
memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 64M
expose_php = Off
display_errors = Off
log_errors = On

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Le code ne change qu'avec une nouvelle image : pas de contrôle de date des fichiers.
opcache.validate_timestamps = 0
