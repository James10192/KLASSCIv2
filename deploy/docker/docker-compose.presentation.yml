# Instance « presentation » sur un VPS. Les secrets ne sont PAS ici :
# copier presentation.env.example en presentation.env et le remplir (fichier ignoré par git).
name: klassci-presentation

x-app-common: &app-common
  build:
    context: ../..
    dockerfile: Dockerfile
  image: klassci/presentation:latest
  env_file: presentation.env
  volumes:
    - app-storage:/var/www/html/storage/app
    - app-logs:/var/www/html/storage/logs
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app-common
    ports:
      - "8080:80"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/login", "-o", "/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Planificateur : une seule réplique, jamais en double avec un autre serveur.
  scheduler:
    <<: *app-common
    command: ["sh", "-c", "while true; do php artisan schedule:run; sleep 60; done"]
    mem_limit: 384m

  mysql:
    image: mysql:8.0
    env_file: presentation.env
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=512M"]
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h 127.0.0.1 -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  app-storage:
  app-logs:
  mysql-data:
