; Pool PHP-FPM d'une instance. Les processus ne sont créés qu'à la demande
; et le nombre est plafonné : c'est ce qui tient la mémoire d'un VPS partagé.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 500
catch_workers_output = yes
clear_env = no
