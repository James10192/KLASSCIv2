name: Temporary Yakro bulletin margins and semester patch

on:
  push:
    branches:
      - esbtp-yakro

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore(ci): run Yakro bulletin margins and semester patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esbtp-yakro
          fetch-depth: 0

      - name: Apply DomPDF-safe patch
        run: python .github/scripts/tmp-yakro-bulletin-margins-semester.py

      - name: Validate intended PDF contract
        run: |
          grep -F 'margin: {{ $pdfSettings['"'"'margin_top'"'"'] ?? 20 }}mm' resources/views/esbtp/bulletins/pdf-configurable.blade.php
          grep -F '{{ $pdfSettings['"'"'margin_right'"'"'] ?? 15 }}mm' resources/views/esbtp/bulletins/pdf-configurable.blade.php
          grep -F 'padding: {{ $pdfSettings['"'"'margin_top'"'"'] ?? 20 }}mm' resources/views/esbtp/bulletins/pdf-configurable.blade.php
          grep -F 'font-size: {{ min(34, $headerRightFont + 4) }}px;' resources/views/esbtp/bulletins/pdf-configurable.blade.php
          grep -F 'border: 1.5px solid {{ $pdfPrimary }};' resources/views/esbtp/bulletins/pdf-configurable.blade.php
          ! grep -F 'margin: 2mm 2mm;' resources/views/esbtp/bulletins/pdf-configurable.blade.php

      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/views/esbtp/bulletins/pdf-configurable.blade.php
          git commit -m 'fix(bulletins): honor PDF margins and emphasize Yakro semester'
          git push origin HEAD:esbtp-yakro
