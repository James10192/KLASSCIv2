name: Deploy presentation tenant

on:
  push:
    branches:
      - presentation
    paths:
      - '.github/workflows/deploy-presentation-tenant.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://presentation.klassci.com
      CLI_TOKEN: ${{ secrets.KLASSCI_CLI_TOKEN_PRESENTATION || secrets.KLASSCI_PRESENTATION_CLI_TOKEN || secrets.KLASSCI_CLI_TOKEN }}
    steps:
      - name: Vérifier le jeton de déploiement
        shell: bash
        run: |
          if [ -z "$CLI_TOKEN" ]; then
            echo "Aucun secret CLI de presentation n'est configure dans GitHub Actions."
            exit 1
          fi

      - name: Mettre à jour le code du tenant
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$BASE_URL/api/cli/pull" \
            -H "Authorization: Bearer $CLI_TOKEN" \
            -H "Accept: application/json"

      - name: Appliquer les migrations
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$BASE_URL/api/cli/migrate" \
            -H "Authorization: Bearer $CLI_TOKEN" \
            -H "Accept: application/json"

      - name: Vider les caches
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$BASE_URL/api/cli/cache/clear" \
            -H "Authorization: Bearer $CLI_TOKEN" \
            -H "Accept: application/json"

      - name: Réparer les permissions applicatives
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$BASE_URL/api/cli/permissions/fix" \
            -H "Authorization: Bearer $CLI_TOKEN" \
            -H "Accept: application/json"
