name: Deploy presentation via FTP

on:
  push:
    branches:
      - presentation
    paths:
      - '.github/workflows/deploy-presentation-ftp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy presentation tenant
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Upload presentation branch to demo tenant
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /home/c2569688c/public_html/presentation/
          protocol: ftp
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/vendor/**
            **/node_modules/**
            **/.env
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/bootstrap/cache/**
          log-level: standard
