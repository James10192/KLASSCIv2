name: Temporary Yakro PDF controls runner

on:
  push:
    branches:
      - esbtp-yakro

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore(ci): run Yakro PDF controls patch v2' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esbtp-yakro
          fetch-depth: 0

      - name: Apply patch v2
        run: python3 .github/scripts/tmp-yakro-pdf-controls-v2.py

      - name: Validate patch contracts
        run: |
          php -l app/Http/Controllers/ESBTPBulletinController.php
          php -l app/Services/BulletinService.php
          php -l tests/Feature/Bulletin/BtsBulletinConfigurationHttpTest.php
          php -l tests/Feature/Bulletin/BulletinYakroTypographyContractTest.php
          grep -q "bulletin_header_logo_height" resources/views/esbtp/bulletins/pdf-configurable.blade.php
          grep -q 'height: {{ $signatureHeight }}px' resources/views/esbtp/bulletins/pdf-configurable.blade.php
          grep -q 'opacity: {{ $authenticityOpacity }}' resources/views/esbtp/bulletins/pdf-configurable.blade.php
          grep -q 'name="bulletin_authenticity_opacity"' resources/views/esbtp/bulletins/configuration.blade.php

      - name: Commit functional changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Http/Controllers/ESBTPBulletinController.php \
                  app/Services/BulletinService.php \
                  resources/views/esbtp/bulletins/configuration.blade.php \
                  resources/views/esbtp/bulletins/pdf-configurable.blade.php \
                  tests/Feature/Bulletin/BtsBulletinConfigurationHttpTest.php \
                  tests/Feature/Bulletin/BulletinYakroTypographyContractTest.php
          git commit -m "feat(bulletins): make Yakro header and footer sizing configurable"
          git push origin HEAD:esbtp-yakro
