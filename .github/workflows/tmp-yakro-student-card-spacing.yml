name: Temporary Yakro student card spacing patch

on:
  push:
    branches:
      - esbtp-yakro

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore(ci): run Yakro student card spacing patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esbtp-yakro
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/tmp-yakro-student-card-spacing.py

      - name: Validate patch
        shell: bash
        run: |
          php -l tests/Feature/Bulletin/BulletinYakroTypographyContractTest.php
          grep -Fq 'color: {{ $pdfText }};' resources/views/esbtp/bulletins/pdf-configurable.blade.php
          grep -Fq 'color: {{ $pdfSecondary }};' resources/views/esbtp/bulletins/pdf-configurable.blade.php
          grep -Fq 'width: 136px;' resources/views/esbtp/bulletins/pdf-configurable.blade.php
          grep -Fq 'width: 116px;' resources/views/esbtp/bulletins/pdf-configurable.blade.php
          if grep -Fq '<div class="info-section-title">Identité</div>' resources/views/esbtp/bulletins/pdf-configurable.blade.php; then exit 1; fi
          if grep -Fq '<div class="info-section-title">Scolarité</div>' resources/views/esbtp/bulletins/pdf-configurable.blade.php; then exit 1; fi

      - name: Commit functional changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/esbtp/bulletins/pdf-configurable.blade.php tests/Feature/Bulletin/BulletinYakroTypographyContractTest.php
          git commit -m "fix(bulletins): compact Yakro identity card and use PDF text color"
          git push origin HEAD:esbtp-yakro
