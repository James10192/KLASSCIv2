          replace_once(path, "<div style=\"font-size: {{ $typeScale['signature'] }}px;\">{{ $directorTitle }}</div>", "<div style=\"font-size: {{ $signatureFontSize }}px;\">{{ $directorTitle }}</div>")
          replace_once(path, "<div style=\"margin-top: 4px; font-weight: 700; font-size: {{ $typeScale['signature'] }}px;\">{{ $directorName }}</div>", "<div style=\"margin-top: 4px; font-weight: 700; font-size: {{ $signatureFontSize }}px;\">{{ $directorName }}</div>")

          # 5) Yakro HTML preview header mirrors the same settings ---------------
          path = 'resources/views/esbtp/bulletins/preview.blade.php'
          replace_once(
              path,
              '''    $typeScale = \\App\\Services\\BulletinTypography::scale($settings['bulletin_font_size'] ?? 13);
    $headerScale = max(80, min(150, (int) ($settings['bulletin_header_scale'] ?? 100)));
    $headerRatio = $headerScale / 100;
    $headerFont = static fn ($px) => round(((float) $px) * $headerRatio, 2);
''',
              '''    $typeScale = \\App\\Services\\BulletinTypography::scale($settings['bulletin_font_size'] ?? 13);
    $headerScale = max(70, min(220, (int) ($settings['bulletin_header_scale'] ?? 100)));
    $headerRatio = $headerScale / 100;
