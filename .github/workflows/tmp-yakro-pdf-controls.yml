        }
''',
              '''        .signature-box {
            display: inline-block;
            text-align: center;
            min-width: {{ $signatureWidth }}px;
        }
        .signature-line {
            width: {{ $signatureWidth }}px;
            height: {{ $signatureHeight }}px;
            border-bottom: 1.5px solid {{ $pdfPrimary }};
            margin-top: 4px;
        }
'''
