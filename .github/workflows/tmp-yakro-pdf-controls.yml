    $logoBaseHeight = is_numeric($settings['bulletin_header_logo_height'] ?? null) ? (int) $settings['bulletin_header_logo_height'] : 72;
    $headerLogoSize = max(40, min(180, (int) round($logoBaseHeight * $headerRatio)));
'''
          )
          replace_once(path, "        font-size: {{ $headerFont($typeScale['title']) }}px;", "        font-size: {{ $headerLeftFont }}px;",)
          replace_once(path, "        font-size: {{ $headerFont($typeScale['info']) }}px;\n    }\n\n    .motto", "        font-size: {{ $headerLeftFont }}px;\n    }\n\n    .motto")
          replace_once(path, "        font-size: {{ $headerFont($typeScale['info']) }}px;\n    }\n\n    .bulletin-title", "        font-size: {{ $headerLeftFont }}px;\n    }\n\n    .bulletin-title")
          replace_once(path, "        font-size: {{ $headerFont($typeScale['title']) }}px;\n        text-transform: uppercase;", "        font-size: {{ $headerTitleFont }}px;\n        text-transform: uppercase;")
          replace_once(path, "        font-size: {{ $headerFont($typeScale['info']) }}px;\n    }\n\n    .academic-year", "        font-size: {{ $headerRightFont }}px;\n    }\n\n    .academic-year")
