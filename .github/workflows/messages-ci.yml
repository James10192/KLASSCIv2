name: Messages Hub CI

on:
  pull_request:
    branches: [presentation]
    paths:
      - 'app/Http/Controllers/MessageHub*.php'
      - 'app/Services/Messages/**'
      - 'app/Models/ChatConversation*.php'
      - 'app/Models/ChatContextAccessLog.php'
      - 'app/Models/ChatMessage.php'
      - 'app/Models/WorkflowAction*.php'
      - 'app/Domain/Assistant/Harnais/SafeMessageHubPrompt.php'
      - 'database/migrations/*message_context*'
      - 'routes/message-hub.php'
      - 'resources/views/messages/**'
      - 'public/js/messages-hub-v2.js'
      - 'public/js/messages-hub-v2-hardening.js'
      - 'public/css/messages-hub-v2.css'
      - 'tests/Feature/Messages/**'
      - 'tests/browser/messages-critical.js'
      - '.github/workflows/messages-ci.yml'

jobs:
  integration:
    name: Context truth, actions and Nanan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: klassci_testing
      DB_USERNAME: root
      DB_PASSWORD: ''
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: klassci_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, tokenizer

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate:fresh --force

      - name: JavaScript syntax
        run: |
          node --check public/js/messages-hub-v2.js
          node --check public/js/messages-hub-v2-hardening.js
          node --check tests/browser/messages-critical.js

      - name: Losseni/KIPRE + legacy workflow + action persistence
        run: php vendor/bin/phpunit tests/Feature/Messages/MessageHubTruthAndActionsTest.php --no-coverage
