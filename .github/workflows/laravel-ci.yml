name: Laravel CI

on:
  pull_request:
    branches: [presentation, main]

  # Sur une poussee directe, huit des neuf controles de ce job gardent tout
  # leur sens : syntaxe PHP, syntaxe Blade, validation de composer.json. Seul
  # le verificateur de noms de classe compare la branche a sa cible et n'a
  # donc rien a comparer ici — il est saute explicitement plus bas.
  push:
    branches:
      - presentation
      - esbtp-abidjan
      - esbtp-yakro
      - ephrata
      - hetec
      - rostan
      - usat
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'


# Une execution annulee est une execution payee pour rien : quand une nouvelle
# poussee arrive sur la meme reference, la precedente n'apprend plus rien.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Voir hygiene-commits : une branche d'etablissement rejoue un commit deja
  # verifie. Le filet reste pose sur les poussees divergentes.
  garde:
    name: Ce commit a-t-il deja ete verifie ?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rejouer: ${{ steps.decide.outputs.rejouer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: |
          if [ "${{ github.event_name }}" != 'push' ] || [ "${{ github.ref_name }}" = 'presentation' ]; then
            echo 'rejouer=oui' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin presentation
          if git merge-base --is-ancestor "${{ github.sha }}" origin/presentation; then
            echo 'rejouer=non' >> "$GITHUB_OUTPUT"
          else
            echo 'rejouer=oui' >> "$GITHUB_OUTPUT"
          fi

  laravel-checks:
    name: "Laravel Lint & Validation"
    runs-on: ubuntu-latest
    needs: garde
    if: needs.garde.outputs.rejouer == 'oui'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Le verificateur de noms de classe compare la branche a sa cible :
          # il lui faut les deux, pas seulement le dernier commit.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_sqlite, dom, filter, gd, json, tokenizer
          tools: composer

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP syntax errors
        run: find app config routes -name "*.php" -print0 | xargs -0 -n1 php -l

      # Chaque operation d'ecriture de la CLI est declaree pour Nanan : faite par
      # lui, a lui apprendre, ou hors de sa portee avec la raison. Une operation
      # faite a la main pour une ecole ne doit pas rester a la main. Ne touche
      # pas la base : la liste des routes suffit.
      - name: Couverture Nanan
        run: |
          cp -n .env.example .env
          php artisan key:generate --force --no-interaction
          php bin/verifier-couverture-nanan.php

      # `php -l` ne voit PAS un `use` oublie : la syntaxe est correcte, le nom
      # ne se resout qu'a l'execution. En aout 2026, une extraction de classe a
      # laisse `ESBTPCandidature` sans import, et le catalogue du portail public
      # a rendu 500 pour les six ecoles. Ce controle-la existait deja, en ligne
      # de commande, a taper a la main — c'est-a-dire protege par la meme
      # discipline humaine qui avait laisse passer l'incident.
      #
      # Sur le DIFF, pas sur `app/` entier : le depot porte une soixantaine de
      # noms irresolus anterieurs, chacun demandant de decider si le modele doit
      # naitre ou la relation mourir. Les traiter est un chantier ; les laisser
      # bloquer chaque PR en serait un autre.
      - name: Test disponibilités des classes selon l'année des inscriptions
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/InscriptionEditFormScriptsTest.php --stop-on-failure

      - name: Test accès protégé au PDF historique des évaluations
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Feature/Security/EvaluationPdfRouteAccessTest.php --stop-on-failure

      - name: Test auth étudiant-parent (routes et compatibilité)
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Feature/Auth/SharedStudentAccountRoutesTest.php --stop-on-failure

      - name: Test réparation des jetons de connexion et inscription sûre
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Feature/Auth/PasswordResetStorageRepairTest.php --stop-on-failure

      # La limitation de débit WhatsApp ne doit jamais appeler MailPulse
      # quand le quota ou le cache partagé bloque le départ.
      - name: Test absences corrigées et reprise MailPulse
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/Services/MailPulse/MailPulseAbsenceValidityTest.php --stop-on-failure

      - name: Test périmètre des notes dans les fiches
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/Services/Notes/EvaluationsDeLaFicheTest.php tests/Unit/Services/Notes/FicheNotesIntegrationUxTest.php --stop-on-failure

      - name: Test fiche étudiant sans calcul de dossier inutilisé
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/Controllers/StudentShowDossierWorkloadTest.php --stop-on-failure

      - name: Test ergonomie des fiches et modales AJAX
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/Views/AcademicFicheUxContractTest.php --stop-on-failure

      - name: Test documents académiques BTS et LMD sur les fiches
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/Views/AcademicDocumentsNavigationTest.php --stop-on-failure

      - name: Test PDF groupé LMD, garde impression et isolation BTS
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Feature/Bulletins/TachesBulletinsArrierePlanTest.php tests/Unit/Services/DocumentPrintGuardTest.php --stop-on-failure

      - name: Test menu de reçu au-dessus des cartes paiement
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/Views/PaymentReceiptDropdownLayerTest.php --stop-on-failure

      - name: Test horodatages véridiques des paiements et reçus
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/Views/PaymentActualTimestampDisplayTest.php --stop-on-failure

      - name: Test horodatage et identité caissier des reçus
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/Views/PaymentReceiptTimeIdentityContractTest.php --stop-on-failure

      - name: Test navigation des réglages bulletins
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/Views/BulletinSettingsNavigationTest.php --stop-on-failure

      - name: Test classement par matière des évaluations en fiche
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/Views/AcademicFicheMatiereUxContractTest.php --stop-on-failure

      - name: Vérifier la syntaxe du regroupement JS des évaluations
        if: github.event_name == 'pull_request'
        run: node --check < resources/views/esbtp/partials/_fiche-notes-view-script.blade.php

      - name: Test cohérence des maquettes et filtres pédagogiques AJAX
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/Views/AcademicPlanningUxContractTest.php tests/Unit/Views/EvaluationIndexAjaxContractTest.php --stop-on-failure

      - name: Test outbox persistante MailPulse et récupération cron
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/Services/MailPulse/MailPulseWorkflowIntentOutboxTest.php --stop-on-failure

      - name: Test garde débit MailPulse WhatsApp
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/Services/MailPulse/MailPulseWhatsAppThrottleTest.php --stop-on-failure

      - name: Test emails familiaux sans doublons
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/Services/Notifications/WorkflowEmailAuthorityTest.php tests/Unit/Services/Notifications/FamilyWorkflowMailerTest.php tests/Unit/Services/MailPulse/MailPulseWorkflowPolicyTest.php --stop-on-failure

      - name: Test confidentialité des alertes MailPulse
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/Services/MailPulse/MailPulseWorkflowDisclosureTest.php tests/Unit/Services/MailPulse/MailPulseParentNotificationLogTest.php --stop-on-failure

      - name: Test changements d'état des paiements notifiés
        if: github.event_name == 'pull_request'
        run: php artisan test tests/Unit/Services/MailPulse/MailPulseStalePaymentTest.php --stop-on-failure

      - name: Check unresolved class names (changed files)
        # Compare la branche a sa cible : sans pull request, il n'y a pas de
        # cible a comparer.
        if: github.event_name == 'pull_request'
        # Pas de `|| true` sur le `git diff` : une base introuvable, une
        # recuperation partielle ou une branche renommee rendraient une liste
        # vide, et l'etape afficherait « aucun fichier PHP modifie » — une
        # phrase fausse — avant de sortir en succes. Ce controle existe parce
        # qu'un defaut est passe une fois sans que personne ne le voie ; le
        # remplacer par un garde qui peut se taire, et se taire en mentant,
        # reconduirait la meme faiblesse sous un autre nom.
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          if ! git rev-parse --verify --quiet "$BASE" > /dev/null; then
            echo "::error::Base $BASE introuvable : impossible de determiner les fichiers modifies."
            exit 1
          fi
          mapfile -t FICHIERS < <(git diff --name-only --diff-filter=d "$BASE...HEAD" -- '*.php')
          if [ ${#FICHIERS[@]} -eq 0 ]; then
            echo "Aucun fichier PHP modifie par rapport a $BASE."
            exit 0
          fi
          printf '%s\n' "${FICHIERS[@]}"
          php bin/verifier-classes.php "${FICHIERS[@]}"
          # Namespace et nom de classe doivent suivre le chemin a la casse pres :
          # PSR-4 y est sensible sous Linux, pas sous Windows ni macOS.
          php bin/verifier-casse-psr4.php "${FICHIERS[@]}"

      - name: Check Blade syntax
        run: |
          echo "Checking for common Blade issues..."
          # Check for unclosed directives
          find resources/views -name "*.blade.php" -exec grep -l "@if\|@foreach\|@for\|@while" {} \; | while read f; do
            opens=$(grep -c "@if\|@foreach\|@for\|@while" "$f" 2>/dev/null || echo 0)
            closes=$(grep -c "@endif\|@endforeach\|@endfor\|@endwhile" "$f" 2>/dev/null || echo 0)
            if [ "$opens" != "$closes" ]; then
              echo "::warning file=$f::Mismatched Blade directives (opens=$opens, closes=$closes)"
            fi
          done

      - name: Validate composer.json
        run: composer validate --strict
