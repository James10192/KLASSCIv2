name: Laravel CI

on:
  pull_request:
    branches: [presentation, main]

jobs:
  laravel-checks:
    name: "Laravel Lint & Validation"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Le verificateur de noms de classe compare la branche a sa cible :
          # il lui faut les deux, pas seulement le dernier commit.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, tokenizer
          tools: composer

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP syntax errors
        run: find app config routes -name "*.php" -print0 | xargs -0 -n1 php -l

      # `php -l` ne voit PAS un `use` oublie : la syntaxe est correcte, le nom
      # ne se resout qu'a l'execution. En aout 2026, une extraction de classe a
      # laisse `ESBTPCandidature` sans import, et le catalogue du portail public
      # a rendu 500 pour les six ecoles. Ce controle-la existait deja, en ligne
      # de commande, a taper a la main — c'est-a-dire protege par la meme
      # discipline humaine qui avait laisse passer l'incident.
      #
      # Sur le DIFF, pas sur `app/` entier : le depot porte une soixantaine de
      # noms irresolus anterieurs, chacun demandant de decider si le modele doit
      # naitre ou la relation mourir. Les traiter est un chantier ; les laisser
      # bloquer chaque PR en serait un autre.
      - name: Check unresolved class names (changed files)
        # Pas de `|| true` sur le `git diff` : une base introuvable, une
        # recuperation partielle ou une branche renommee rendraient une liste
        # vide, et l'etape afficherait « aucun fichier PHP modifie » — une
        # phrase fausse — avant de sortir en succes. Ce controle existe parce
        # qu'un defaut est passe une fois sans que personne ne le voie ; le
        # remplacer par un garde qui peut se taire, et se taire en mentant,
        # reconduirait la meme faiblesse sous un autre nom.
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          if ! git rev-parse --verify --quiet "$BASE" > /dev/null; then
            echo "::error::Base $BASE introuvable : impossible de determiner les fichiers modifies."
            exit 1
          fi
          mapfile -t FICHIERS < <(git diff --name-only --diff-filter=d "$BASE...HEAD" -- '*.php')
          if [ ${#FICHIERS[@]} -eq 0 ]; then
            echo "Aucun fichier PHP modifie par rapport a $BASE."
            exit 0
          fi
          printf '%s\n' "${FICHIERS[@]}"
          php bin/verifier-classes.php "${FICHIERS[@]}"

      - name: Check Blade syntax
        run: |
          echo "Checking for common Blade issues..."
          # Check for unclosed directives
          find resources/views -name "*.blade.php" -exec grep -l "@if\|@foreach\|@for\|@while" {} \; | while read f; do
            opens=$(grep -c "@if\|@foreach\|@for\|@while" "$f" 2>/dev/null || echo 0)
            closes=$(grep -c "@endif\|@endforeach\|@endfor\|@endwhile" "$f" 2>/dev/null || echo 0)
            if [ "$opens" != "$closes" ]; then
              echo "::warning file=$f::Mismatched Blade directives (opens=$opens, closes=$closes)"
            fi
          done

      - name: Validate composer.json
        run: composer validate --strict
