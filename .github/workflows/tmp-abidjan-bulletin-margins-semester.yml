name: Temporary Abidjan bulletin margins and semester patch

on:
  push:
    branches:
      - esbtp-abidjan

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore(ci): run Abidjan bulletin margins and semester patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esbtp-abidjan
          fetch-depth: 0

      - name: Apply DomPDF-safe patch
        run: python .github/scripts/tmp-abidjan-bulletin-margins-semester.py

      - name: Validate intended PDF contract
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path('resources/views/esbtp/bulletins/pdf-configurable.blade.php').read_text()
          assert "margin: {{ $pdfSettings['margin_top'] ?? 20 }}mm" in t
          assert "padding: {{ $pdfSettings['margin_top'] ?? 20 }}mm" in t
          assert "font-size: {{ min(30, $typeScale['table'] + 4) }}px;" in t
          assert 'border: 1.5px solid {{ $pdfPrimary }};' in t
          assert 'margin: 2mm 2mm;' not in t
          PY

      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/views/esbtp/bulletins/pdf-configurable.blade.php
          git commit -m 'fix(bulletins): honor PDF margins and emphasize Abidjan semester'
          git push origin HEAD:esbtp-abidjan
