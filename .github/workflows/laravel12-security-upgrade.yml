name: Laravel 12 security dependency resolution (draft only)

# Isolated diagnostic branch. Never runs on presentation or tenant deploy branches.
on:
  push:
    branches:
      - security/laravel12-token-guard-20261025
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    if: github.ref == 'refs/heads/security/laravel12-token-guard-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: PHP 8.3 and Composer v2 for cPanel compatibility
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, dom, curl, zip, gd, intl, bcmath, pdo_mysql, sodium
          tools: composer:v2
          coverage: none

      - name: Resolve Laravel 12.68+ and all compatible dependencies (no application scripts)
        run: composer update --with-all-dependencies --no-scripts --no-interaction --prefer-dist --no-progress

      - name: Confirm installed Laravel is patched and keep Composer security audit enforced
        shell: bash
        run: |
          composer show laravel/framework --locked
          php -r '$lock = json_decode(file_get_contents("composer.lock"), true); foreach ($lock["packages"] as $p) { if ($p["name"] === "laravel/framework") { if (!preg_match("/^v12\\.(\\d+)\\./", $p["version"], $m) || (int)$m[1] < 68) { fwrite(STDERR, "Laravel TokenGuard security version not reached\\n"); exit(1); } exit(0); } } exit(1);'
          composer audit --locked --no-dev

      - name: Validate generated lockfile
        run: composer validate --no-check-publish

      - name: Save resolved lock to this isolated draft branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          if git diff --cached --quiet; then
            echo 'Lockfile already up to date'
          else
            git commit -m 'build(deps): resolve patched Laravel 12 dependency lock'
            git push origin HEAD:security/laravel12-token-guard-20261025
          fi
