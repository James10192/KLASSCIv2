name: Temporary Yakro student card redesign

on:
  push:
    branches: [esbtp-yakro]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(ci): apply Yakro student card redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esbtp-yakro
          fetch-depth: 0

      - name: Apply DomPDF-safe student card redesign
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('resources/views/esbtp/bulletins/pdf-configurable.blade.php')
          text = path.read_text()

          css_start = text.index('        /* ── Fiche étudiant ───────────────────────────────────── */')
          css_end = text.index('        /* ── Tableau matières ─────────────────────────────────── */', css_start)

          new_css = r'''        /* ── Fiche étudiant ───────────────────────────────────── */
          .student-info {
              width: 100%;
              margin-bottom: 6px;
              border: 1px solid #cbd5e1;
              border-radius: 8px;
              background: #ffffff;
              overflow: hidden;
          }
          .student-info-table {
              width: 100%;
              border-collapse: collapse;
              table-layout: fixed;
              margin: 0;
          }
          .student-info-table > tbody > tr > td {
              border: none;
              word-wrap: break-word;
          }

          /* Photo : table layout uniquement, compatible DomPDF. */
          .student-info-table td.student-photo-cell {
              width: 104px;
              min-width: 104px;
              text-align: center;
              vertical-align: middle;
              padding: 7px 8px;
              background-color: #f8fafc;
              border-right: 2px solid {{ $pdfPrimary }};
          }
          .student-photo-shell {
              width: 78px;
              height: 88px;
              margin: 0 auto;
              border: 1.5px solid {{ $pdfPrimary }};
              border-radius: 7px;
              background-color: #ffffff;
              overflow: hidden;
          }
          .student-photo-shell img.student-photo {
              width: 78px;
              height: 88px;
              display: block;
              margin: 0;
              object-fit: cover;
          }
          .avatar-initials-fallback {
              width: 78px;
              height: 88px;
              display: table;
              background-color: #eef2f7;
          }
          .avatar-initials-fallback span {
              display: table-cell;
              vertical-align: middle;
              text-align: center;
              font-size: {{ $typeScale['avatar'] }}px;
              color: {{ $pdfPrimary }};
              font-weight: 700;
          }
          .matricule-badge {
              display: inline-block;
              margin-top: 5px;
              padding: 2px 6px;
              border: 1px solid #d8e0e8;
              border-radius: 4px;
              background-color: #ffffff;
              color: #334155;
              font-weight: 700;
              font-size: {{ $typeScale['meta'] }}px;
              text-align: center;
              white-space: nowrap;
          }

          /* Deux zones lisibles : identité et scolarité. */
          .student-info-table td.info-group {
              width: 43%;
              vertical-align: top;
              padding: 6px 10px 5px;
              background-color: #ffffff;
          }
          .student-info-table td.student-academic-group {
              border-left: 1px solid #e5e7eb;
          }
          .info-section-title {
              margin: 0 0 3px;
              padding-bottom: 3px;
              border-bottom: 1px solid #e2e8f0;
              color: {{ $pdfPrimary }};
              font-size: {{ $typeScale['meta'] }}px;
              font-weight: 700;
              text-transform: uppercase;
              letter-spacing: 0.08em;
          }
          .info-table {
              width: 100%;
              border-collapse: collapse;
              margin: 0;
          }
          .info-table td {
              padding: 3px 0;
              border: none;
              border-bottom: 1px solid #eef2f7;
              vertical-align: middle;
          }
          .info-table tr:last-child td { border-bottom: none; }
          .info-table td.info-label {
              width: 41%;
              padding-right: 8px;
              color: #64748b;
              font-size: {{ $typeScale['label'] }}px;
              font-weight: 700;
              text-transform: uppercase;
              letter-spacing: 0.045em;
              white-space: nowrap;
          }
          .info-table td.info-value {
              color: #1f2937;
              font-size: {{ $typeScale['table'] }}px;
              font-weight: 600;
              word-wrap: break-word;
          }
          .info-table td.info-value--primary {
              color: {{ $pdfPrimary }};
              font-weight: 700;
          }'''

          text = text[:css_start] + new_css + '\n\n' + text[css_end:]

          html_start = text.index('        {{-- Fiche étudiant --}}')
          html_end = text.index('        {{-- Tableau des matières --}}', html_start)

          new_html = r'''        {{-- Fiche étudiant --}}
          @php
              $prenom = $etudiant->prenoms ?? $etudiant->prenom ?? '';
              $initials = strtoupper(substr($etudiant->nom ?? 'E', 0, 1) . substr($prenom ?: 'T', 0, 1));

              // Même fallback photo que le modèle Abidjan : silhouette PNG locale
              // encodée en base64 afin de rester fiable avec DomPDF sans accès distant.
              $avatarFallbackPath = public_path('images/placeholders/student-avatar-fallback.png');
              $avatarFallbackBase64 = is_file($avatarFallbackPath)
                  ? 'data:image/png;base64,'.base64_encode(file_get_contents($avatarFallbackPath))
                  : null;
          @endphp
          <div class="student-info">
              <table class="student-info-table">
                  <tr>
                      <td class="student-photo-cell">
                          <div class="student-photo-shell">
                              @if(isset($photoEtudiantBase64) && $photoEtudiantBase64)
                                  <img src="{{ $photoEtudiantBase64 }}" alt="Photo de l'étudiant" class="student-photo">
                              @elseif($avatarFallbackBase64)
                                  <img src="{{ $avatarFallbackBase64 }}" alt="Avatar étudiant" class="student-photo">
                              @else
                                  <div class="avatar-initials-fallback"><span>{{ $initials }}</span></div>
                              @endif
                          </div>
                          @if(($settings['bulletin_show_matricule'] ?? '1') == '1')
                              <div class="matricule-badge">{{ $etudiant->matricule }}</div>
                          @endif
                      </td>
                      <td class="info-group">
                          <div class="info-section-title">Identité</div>
                          <table class="info-table">
                              <tr>
                                  <td class="info-label">Nom et Prénoms</td>
                                  <td class="info-value info-value--primary">{{ $etudiant->nom }} {{ $etudiant->prenoms ?? $etudiant->prenom }}</td>
                              </tr>
                              @if(($settings['bulletin_show_birth_date'] ?? '1') == '1')
                              <tr>
                                  <td class="info-label">Date de Naissance</td>
                                  <td class="info-value">{{ $etudiant->date_naissance ? \Carbon\Carbon::parse($etudiant->date_naissance)->format('d/m/Y') : 'Non renseignée' }}</td>
                              </tr>
                              @endif
                              <tr>
                                  <td class="info-label">Lieu de Naissance</td>
                                  <td class="info-value">{{ $etudiant->lieu_naissance ?? 'Non renseigné' }}</td>
                              </tr>
                              <tr>
                                  <td class="info-label">Genre</td>
                                  <td class="info-value">{{ $etudiant->genre == 'M' ? 'Masculin' : 'Féminin' }}</td>
                              </tr>
                              @if(($settings['bulletin_show_redoublant'] ?? '1') == '1')
                              <tr>
                                  <td class="info-label">Redoublant</td>
                                  <td class="info-value">{{ ($inscription?->is_redoublant ?? false) ? 'Oui' : 'Non' }}</td>
                              </tr>
                              @endif
                              @if(($settings['bulletin_show_student_phone'] ?? '1') == '1')
                              <tr>
                                  <td class="info-label">Téléphone</td>
                                  <td class="info-value">{{ $etudiant->telephone ?? 'Non renseigné' }}</td>
                              </tr>
                              @endif
                          </table>
                      </td>
                      <td class="info-group student-academic-group">
                          <div class="info-section-title">Scolarité</div>
                          <table class="info-table">
                              <tr>
                                  <td class="info-label">Classe</td>
                                  <td class="info-value info-value--primary">{{ $classe->libelle ?? $classe->name }}</td>
                              </tr>
                              @if(!empty($isSpecialisation) && !empty($classeTroncCommun) && ($settings['tronc_commun_bulletin_show_origin'] ?? '1') == '1')
                              <tr>
                                  <td class="info-label">Classe S1 (TC)</td>
                                  <td class="info-value">{{ $classeTroncCommun->libelle ?? $classeTroncCommun->name }}</td>
                              </tr>
                              @endif
                              <tr>
                                  <td class="info-label">Année d'étude</td>
                                  <td class="info-value">{{ $classe->niveau->libelle ?? $classe->niveau->name ?? ($classe->annee ?? 'N/A') }}</td>
                              </tr>
                              <tr>
                                  <td class="info-label">Filière</td>
                                  <td class="info-value">{{ $classe->filiere->name ?? 'N/A' }}</td>
                              </tr>
                              <tr>
                                  <td class="info-label">Effectif</td>
                                  <td class="info-value">{{ $effectif }}</td>
                              </tr>
                          </table>
                      </td>
                  </tr>
              </table>
          </div>
'''

          text = text[:html_start] + new_html + '\n' + text[html_end:]
          path.write_text(text)

          test = Path('tests/Feature/Bulletin/YakroBulletinStudentCardContractTest.php')
          test.write_text(r'''<?php

namespace Tests\Feature\Bulletin;

use Tests\TestCase;

class YakroBulletinStudentCardContractTest extends TestCase
{
    public function test_yakro_student_card_uses_dompdf_safe_photo_fallback_and_table_layout(): void
    {
        $view = file_get_contents(resource_path('views/esbtp/bulletins/pdf-configurable.blade.php'));

        $this->assertStringContainsString("public_path('images/placeholders/student-avatar-fallback.png')", $view);
        $this->assertStringContainsString("'data:image/png;base64,'.base64_encode(file_get_contents(\$avatarFallbackPath))", $view);
        $this->assertStringContainsString('class="student-photo-cell"', $view);
        $this->assertStringContainsString('class="student-photo"', $view);
        $this->assertStringContainsString('class="info-section-title">Identité</div>', $view);
        $this->assertStringContainsString('class="info-section-title">Scolarité</div>', $view);
        $this->assertStringContainsString('student-academic-group', $view);
        $this->assertStringContainsString('info-value--primary', $view);
        $this->assertStringNotContainsString('display: flex', $view);
        $this->assertStringNotContainsString('display: grid', $view);
    }
}
''')
          PY

          php -l tests/Feature/Bulletin/YakroBulletinStudentCardContractTest.php

          grep -q "student-avatar-fallback.png" resources/views/esbtp/bulletins/pdf-configurable.blade.php
          grep -q "info-section-title\">Identité" resources/views/esbtp/bulletins/pdf-configurable.blade.php
          grep -q "info-section-title\">Scolarité" resources/views/esbtp/bulletins/pdf-configurable.blade.php

      - name: Commit redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/esbtp/bulletins/pdf-configurable.blade.php tests/Feature/Bulletin/YakroBulletinStudentCardContractTest.php
          git commit -m "feat(bulletins): redesign Yakro student identity card"
          git push origin HEAD:esbtp-yakro
