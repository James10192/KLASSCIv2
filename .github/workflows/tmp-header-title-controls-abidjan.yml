name: Temporary Abidjan header title controls

on:
  push:
    branches:
      - esbtp-abidjan

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore(ci): run Abidjan header title controls' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esbtp-abidjan
          fetch-depth: 0

      - name: Apply DomPDF-safe title hierarchy patch
        run: python .github/scripts/tmp-header-title-controls-abidjan.py

      - name: Validate source contract
        run: |
          php -l app/Services/BulletinService.php
          php -l app/Http/Controllers/ESBTPBulletinController.php
          python - <<'PY'
          from pathlib import Path
          g = Path('resources/views/esbtp/bulletins/pdf-configurable.blade.php').read_text()
          a = Path('resources/views/esbtp/bulletins/pdf-configurable-abidjan.blade.php').read_text()
          c = Path('resources/views/esbtp/bulletins/configuration.blade.php').read_text()
          assert 'font-size: {{ $headerTitleFont }}px;' in g
          assert 'font-size: {{ $headerRightFont }}px;' in g
          assert 'font-size: {{ $headerTitleFont }}px;' in a
          assert 'font-size: {{ $headerRightFont }}px;' in a
          assert 'Titre « BULLETIN DE NOTES »' in c
          assert 'Semestre / diplôme / niveau / année' in c
          PY

      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            resources/views/esbtp/bulletins/pdf-configurable.blade.php \
            resources/views/esbtp/bulletins/pdf-configurable-abidjan.blade.php \
            resources/views/esbtp/bulletins/configuration.blade.php \
            app/Http/Controllers/ESBTPBulletinController.php \
            app/Services/BulletinService.php
          git commit -m 'fix(bulletins): make document title dominant on Abidjan'
          git push origin HEAD:esbtp-abidjan
