name: Temporary Yakro header readability patch

on:
  push:
    branches:
      - esbtp-yakro

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore(ci): run Yakro header readability patch' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esbtp-yakro
          fetch-depth: 0

      - name: Apply DomPDF-safe patch
        run: python .github/scripts/tmp-yakro-header-readability.py

      - name: Validate intended CSS contract
        run: |
          grep -F 'font-size: {{ min(32, $headerRightFont + 2) }}px;' resources/views/esbtp/bulletins/pdf-configurable.blade.php
          grep -F 'color: {{ $pdfText }};' resources/views/esbtp/bulletins/pdf-configurable.blade.php
          grep -F 'opacity: {{ $authenticityOpacity }};' resources/views/esbtp/bulletins/pdf-configurable.blade.php
          ! grep -F 'color: #6b7280;' resources/views/esbtp/bulletins/pdf-configurable.blade.php

      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/views/esbtp/bulletins/pdf-configurable.blade.php
          git commit -m 'fix(bulletins): improve Yakro header and footer readability'
          git push origin HEAD:esbtp-yakro
