name: Temporary unified Yakro maquette patch

on:
  push:
    branches: [esbtp-yakro]
    paths:
      - '.github/scripts/tmp-maquette-unifiee.py'
      - '.github/workflows/tmp-maquette-unifiee.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: klassci_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esbtp-yakro
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, tokenizer
          tools: composer

      - name: Apply unified maquette patch
        run: python3 .github/scripts/tmp-maquette-unifiee.py

      - name: Validate PHP syntax
        run: |
          php -l app/Models/ESBTPMatiereFilierNiveau.php
          php -l app/Http/Requests/Matiere/ClassificationSaveRequest.php
          php -l app/Http/Controllers/ESBTPMatiereClassificationController.php
          php -l app/Services/BulletinService.php
          php -l app/Domain/AcademicPilotage/Services/BtsBulkBulletinGenerationService.php
          php -l app/Domain/AcademicPilotage/Services/AcademicNoteCoverageService.php
          php -l app/Domain/Assistant/Actions/Matieres/ConfigurerMaquetteBts.php
          php -l database/migrations/2026_09_30_123500_add_type_formation_to_esbtp_matiere_filiere_niveau_table.php
          php -l tests/Feature/Matiere/MaquetteTypeFormationTest.php
          php -l tests/Feature/AcademicPilotage/CouvertureHorsMaquetteNomTest.php

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run focused tests
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: klassci_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan test tests/Feature/Matiere/MaquetteTypeFormationTest.php --stop-on-failure
          php artisan test tests/Feature/AcademicPilotage/CouvertureHorsMaquetteNomTest.php --stop-on-failure
          php artisan test tests/Feature/Matiere/MaquetteOrdreSemestreTest.php --stop-on-failure

      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app config database resources tests
          git commit -m 'feat(maquette): unify subject configuration by BTS combo'
          git push origin HEAD:esbtp-yakro
