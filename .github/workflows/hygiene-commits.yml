name: Hygiène des commits

# La barrière qui ne se contourne pas.
#
# Les hooks locaux (.githooks/) donnent un retour immédiat, mais `git commit
# --no-verify` les saute — et un agent pressé le fera. Ce contrôle-ci rejoue
# exactement les mêmes règles sur la pull request, là où personne ne peut
# passer outre.
#
# Il ne lit que les messages : il est donc rapide et ne dépend d'aucune
# installation.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

  # Les tests vivaient ici, et ce workflow ne se declenchait que sur pull
  # request : une poussee DIRECTE sur `presentation` n'etait donc testee par
  # rien. `laravel-ci.yml` ne joue que du lint, et lui aussi seulement sur
  # pull request. Le filet existait, mais pas sur le chemin par lequel le
  # code arrive vraiment en production.
  #
  # Les branches tenant sont incluses parce que ce sont elles que les six
  # etablissements deploient. En regime normal elles ne recoivent que des
  # avances rapides de `presentation`, deja testees — l'execution est alors
  # redondante. Elle ne l'est plus le jour d'un correctif pousse en urgence
  # directement sur une branche tenant, et c'est precisement ce jour-la que
  # personne n'a le temps de lancer les tests a la main.
  push:
    branches:
      - presentation
      - esbtp-abidjan
      - esbtp-yakro
      - ephrata
      - hetec
      - rostan
      - usat
    # Un fichier de documentation ne peut pas casser un test. Sans ce filtre,
    # une simple entree de journal declenchait la matrice MySQL + MariaDB.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'

jobs:
  messages:
    name: Messages de commit
    # `github.base_ref` n'existe que sur une pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Relire chaque commit de la branche
        run: |
          base="origin/${{ github.base_ref }}"
          echec=0

          for sha in $(git rev-list "$base..HEAD"); do
            message=$(git log -1 --format='%B' "$sha")
            sujet=$(git log -1 --format='%s' "$sha")
            court=$(git log -1 --format='%h' "$sha")

            # Un commit de fusion porte un sujet impose par GitHub.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              continue
            fi

            if printf '%s\n' "$message" | grep -qiE '^[[:space:]]*Co-Authored-By:'; then
              echo "::error::$court — signature Co-Authored-By. L'auteur d'un commit est la personne qui en répond."
              echec=1
            fi

            if printf '%s\n' "$message" | grep -qiE 'Generated with|🤖|noreply@anthropic\.com|Claude-Session:'; then
              echo "::error::$court — mention d'outil de génération dans le message."
              echec=1
            fi

            if ! printf '%s\n' "$sujet" | grep -qE '^(feat|fix|refactor|perf|docs|test|chore|build|ci|style|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
              echo "::error::$court — message non conventionnel : $sujet"
              echec=1
            fi
          done

          exit $echec

      - name: Relire le corps de la pull request
        env:
          CORPS: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n' "$CORPS" | grep -qiE 'Generated with \[Claude Code\]|🤖 Generated|Co-Authored-By:'; then
            echo "::error::Le corps de la PR porte une mention d'outil de génération."
            exit 1
          fi
          exit 0

  changelog:
    name: Trace d'un changement visible
    # `github.base_ref` n'existe que sur une pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Un feat ou un fix visible doit laisser une trace
        run: |
          base="origin/${{ github.base_ref }}"
          fichiers=$(git diff --name-only "$base...HEAD")

          touche_appli=$(printf '%s\n' "$fichiers" | grep -cE '^(app|resources|routes|database)/' || true)
          changelog=$(printf '%s\n' "$fichiers" | grep -cE '^CHANGELOG\.md$' || true)

          # Le type se lit sur les commits de la branche, pas sur le titre de la
          # PR : le titre se corrige d'un clic, les commits font foi.
          visible=0
          for sha in $(git rev-list "$base..HEAD"); do
            sujet=$(git log -1 --format='%s' "$sha")
            case "$sujet" in
              feat*|fix*) visible=1 ;;
            esac
          done

          if [ "$visible" -eq 1 ] && [ "$touche_appli" -gt 0 ] && [ "$changelog" -eq 0 ]; then
            if git log "$base..HEAD" --format='%B' | grep -q '\[sans-changelog\]'; then
              echo "::notice::Changement visible sans CHANGELOG, mais [sans-changelog] est déclaré."
              exit 0
            fi
            echo "::error::Cette branche change ce que voit une école mais ne touche pas CHANGELOG.md."
            echo "::error::Ajoutez une entrée sous le mois courant, ou déclarez [sans-changelog] dans un message de commit."
            exit 1
          fi

          exit 0

  nouveautes:
    name: Fraîcheur du modal Nouveautés
    # `github.base_ref` n'existe que sur une pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # Avertit, ne bloque pas : rafraîchir le modal est une décision de
      # communication. Le bloquer serait vite contourné, et le contournement
      # deviendrait la règle.
      - name: Le modal a-t-il pris du retard sur le CHANGELOG ?
        run: php bin/verifier-fraicheur-nouveautes.php

  tests-unitaires:
    name: Tests unitaires (sans base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # pdo_sqlite est demande explicitement, et non suppose : les tests
          # d'exploitation montent leur base en memoire, et setup-php ne
          # garantit pas ce que le build par defaut embarque. Absent, ils
          # tomberaient ici en annoncant un bug qui n'existe pas.
          extensions: mbstring, xml, ctype, iconv, intl, dom, filter, json, tokenizer, pdo_sqlite, sqlite3

      - run: composer install --no-interaction --prefer-dist --no-progress

      # Ces tests ne touchent pas la base : ils tournent en quelques secondes,
      # donc rien ne justifie de ne pas les lancer a chaque PR. Ils couvrent la
      # regle qui dit ou va l'argent d'un versement, celle qui dit si une
      # instance se declare correctement, et celle qui dit ce qu'un jeton CLI a
      # le droit d'ecrire dans un .env.
      #
      # tests/Feature/Exploitation y figure malgre son nom : ces tests montent
      # leur propre base sqlite en memoire, sans service MySQL, et executent le
      # SQL des commandes d'exploitation. C'est la que se voient les colonnes
      # qu'on croit exister — une clause `deleted_at` sur une table qui n'en a
      # pas passe toutes les relectures et tombe au premier lancement chez le
      # client.
      #
      # La liste est explicite parce que tests/Unit n'est pas entierement vert
      # aujourd'hui. Elle a le defaut de sa vertu : un repertoire ajoute demain
      # n'y sera pas, et ne tournera donc nulle part. A remplacer par
      # « tests/Unit » des que l'ensemble passe.
      - name: Regles de frais, d'identite et de deploiement
        run: |
          # Une boucle, et non une suite de chemins sur une meme ligne :
          # PHPUnit 9 n'honore que le PREMIER chemin positionnel et ignore les
          # suivants sans rien dire. La version precedente ne lancait donc que
          # son premier repertoire, en affichant un vert complet.
          echec=0
          for chemin in \
            tests/Unit/Services/Frais \
            tests/Unit/Paiements \
            tests/Unit/Services/FraisAudienceTest.php \
            tests/Unit/Services/ExtensionsDeRoleTest.php \
            tests/Unit/Exploitation \
            tests/Feature/Exploitation \
            tests/Unit/Deployment \
            tests/Unit/Routes \
            tests/Unit/Comptabilite \
            tests/Unit/Photos
          do
            echo "::group::$chemin"
            php vendor/bin/phpunit "$chemin" --no-coverage || echec=1
            echo "::endgroup::"
          done
          exit $echec

  tests-integration-frais:
    name: Tests d'intégration (frais)
    runs-on: ubuntu-latest
    # Une seule declaration : recopiee d'un pas a l'autre, elle finit par
    # deriver — quelqu'un change le port d'un cote seulement.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: klassci_testing
      DB_USERNAME: root
      DB_PASSWORD: ''
    services:
      # MariaDB : c'est ce que fait tourner la flotte, donc c'est sur ce
      # moteur que les tests doivent dire la verite. La portabilite MySQL 8
      # se verifie ailleurs, dans le job « schema ».
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: klassci_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, tokenizer

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement de test
        run: |
          # Sans `|| true` : si .env.example disparait, l'echec doit se
          # produire ICI et se lire, pas trois pas plus loin sous une erreur
          # de connexion qu'on interpretera de travers.
          cp .env.example .env
          php artisan key:generate --force

      # Restreint a CE fichier, pas au dossier : les neuf autres tests de
      # tests/Feature/Frais ne sont pas verts en integration continue
      # aujourd'hui, pour des raisons d'environnement anterieures a ce
      # travail. Un job rouge en permanence ne se lit plus, et il faudrait
      # alors le contourner — ce qui vide de son sens le fait de l'avoir pose.
      - name: Montants nets par frais
        run: php vendor/bin/phpunit tests/Feature/Frais/MontantsNetsParFraisTest.php --no-coverage

      # Une classe LMD ne peut exister que si son parcours ou sa mention a une
      # filiere sur laquelle s'ancrer. Ce controle a une raison d'etre precise :
      # l'ancrage tenait par une coincidence d'identifiants, et USAT ne pouvait
      # creer aucune classe pour trois de ses mentions.
      - name: Ancrage des classes LMD sur une filiere reelle
        run: php vendor/bin/phpunit tests/Feature/Classes/AncrageFiliereLmdTest.php --no-coverage

      # L import d une maquette ne doit pas detruire celle d un autre parcours.
      # Le code d une UE etant unique en base, importer le second parcours
      # reecrivait le premier, en silence.
      - name: L import LMD refuse d ecraser une maquette
        run: php vendor/bin/phpunit tests/Feature/Lmd/ImportRefuseEcrasementTest.php --no-coverage

  schema:
    name: Le schéma se crée entièrement (${{ matrix.moteur.nom }})
    runs-on: ubuntu-latest
    # Son propre job, et pas un pas devant les tests : « le schéma ne se crée
    # pas » et « les montants sont faux » ne se lisent pas pareil et ne se
    # corrigent pas pareil. Confondus dans un seul voyant rouge, on perd
    # l'information la plus utile — laquelle des deux a lâché.
    #
    # Ce contrôle n'existait pas, et c'est pour ça qu'une migration incréable
    # a pu survivre sans que rien ne le signale : personne ne part de zéro.
    #
    # Les deux moteurs, parce qu'ils ne refusent pas les mêmes choses.
    # MariaDB fait tourner la flotte, mais c'est MySQL 8 qui a révélé deux
    # migrations incréables — une valeur par défaut sur colonne JSON, puis une
    # clé étrangère ON DELETE CASCADE sous une colonne générée STORED. Sur le
    # seul MariaDB, les deux seraient encore là.
    strategy:
      fail-fast: false
      matrix:
        moteur:
          - { nom: 'MariaDB 10.11', image: 'mariadb:10.11' }
          - { nom: 'MySQL 8.0', image: 'mysql:8.0' }
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: klassci_testing
      DB_USERNAME: root
      DB_PASSWORD: ''
    services:
      base:
        image: ${{ matrix.moteur.image }}
        # Les deux familles de variables sont fournies ensemble : chaque image
        # lit les siennes et ignore les autres. Une seule déclaration vaut
        # mieux qu'un aiguillage de plus dans la matrice.
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: klassci_testing
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: klassci_testing
        ports: ['3306:3306']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, tokenizer

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate --force

      # Attente côté PHP plutôt que par --health-cmd : la sonde n'a pas le même
      # nom d'un moteur à l'autre, et « la base répond en PDO » est exactement
      # ce dont le pas suivant a besoin.
      - name: Attendre que la base réponde
        run: |
          for i in $(seq 1 60); do
            if php -r 'new PDO("mysql:host=127.0.0.1;port=3306", "root", "");' 2>/dev/null; then
              echo "Base prête après $i tentative(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::La base n'a pas répondu en 120 s."
          exit 1

      - name: Créer le schéma du premier au dernier fichier
        run: php artisan migrate:fresh --force
