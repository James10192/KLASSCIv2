name: Generate announcement attempt migration scaffold
on:
  push:
    branches:
      - feat/annonces-relance-essais-immuables-20261102
  workflow_dispatch:

jobs:
  scaffold:
    if: "contains(github.event.head_commit.message, 'scaffold')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo_sqlite, pdo_mysql
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate real Laravel migration scaffold
        run: |
          cp -n .env.example .env
          php artisan make:migration create_esbtp_annonce_email_attempts_table --create=esbtp_annonce_email_attempts --no-interaction
          echo "__ARTISAN_MIGRATION_BEGIN__"
          f=$(find database/migrations -name '*create_esbtp_annonce_email_attempts_table.php' -print -quit)
          echo "$f"
          cat "$f"
          echo "__ARTISAN_MIGRATION_END__"
